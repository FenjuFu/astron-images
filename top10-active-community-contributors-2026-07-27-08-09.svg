<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Top 10 Active Community Contributors, Jul 27–Aug 9, 2026</title>
  <desc id="desc">An anonymized horizontal bar chart based on message volume across 21 Astron open-source discussion groups. Automated accounts and welcome messages are excluded, and display-name aliases are normalized.</desc>
